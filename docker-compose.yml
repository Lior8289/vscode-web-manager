services:
  backend:
    build:
      context: ./backend
    container_name: vscode-manager-backend
    networks:
      - manager-net

  nginx:
    image: nginx:1.27-alpine
    container_name: vscode-manager-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - manager-net

networks:
  manager-net:
    name: vscode-manager-net
